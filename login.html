<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login | THE ANIME STORE</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">

</head>

<body>

<header class="navbar">

<div class="logo">

THE ANIME STORE

</div>

<nav>

<a href="index.html">Home</a>

<a href="shop.html">Shop</a>

<a href="login.html" class="active">

Login

</a>

</nav>

</header>

<section class="auth-container">

<div class="auth-card">

<h1>Welcome Back 👋</h1>

<p>

Login to continue shopping.

</p>

<input
type="email"
id="loginEmail"
placeholder="Email Address">

<input
type="password"
id="loginPassword"
placeholder="Password">

<label class="remember">

<input
type="checkbox"
id="remember">

Remember Me

</label>

<button id="loginBtn">

Login

</button>

<p>

Don't have an account?

<a href="signup.html">

Create Account

</a>

</p>

</div>

</section>

<script src="js/auth.js"></script>

</body>

</html>
