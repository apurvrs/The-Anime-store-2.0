<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product | THE ANIME STORE</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/product.css">

</head>

<body>

<!-- Navigation -->

<header class="navbar">

<div class="logo">

THE ANIME STORE

</div>

<nav>

<a href="index.html">Home</a>

<a href="shop.html">Shop</a>

<a href="wishlist.html">Wishlist</a>

<a href="cart.html">

🛒 Cart

<span id="cartCount">0</span>

</a>

</nav>

</header>

<!-- Product Section -->

<section class="product-page">

<div class="gallery">

<div class="main-image">

<img

id="mainImage"

src=""

alt="Product Image"

>

</div>

<div

class="thumbnail-container"

id="thumbnailContainer">

<!-- Thumbnails Loaded By JS -->

</div>

</div>

<div class="product-details">

<span

class="product-category"

id="productCategory">

Anime

</span>

<h1 id="productTitle">

Loading...

</h1>

<div

class="rating"

id="productRating">

⭐⭐⭐⭐⭐

</div>

<div

class="price"

id="productPrice">

₹0

</div>

<p

class="description"

id="productDescription">

Loading product description...

</p>

<div class="quantity">

<button id="minus">

−

</button>

<span id="quantity">

1

</span>

<button id="plus">

+

</button>

</div>

<div class="action-buttons">

<button

id="addCart"

class="btn-primary">

🛒 Add To Cart

</button>

<button

id="buyNow"

class="btn-secondary">

⚡ Buy Now

</button>

<button

id="wishlistBtn"

class="btn-outline">

❤️ Wishlist

</button>

</div>

<div class="features">

<div>

🚚 Free Shipping

</div>

<div>

🔒 Secure Payment

</div>

<div>

↩️ Easy Returns

</div>

<div>

⭐ Premium Quality

</div>

</div>

</div>

</section>

<!-- Product Information -->

<section class="tabs">

<div class="tab-buttons">

<button class="tab active">

Description

</button>

<button class="tab">

Specifications

</button>

<button class="tab">

Reviews

</button>

</div>

<div class="tab-content">

<p id="tabContent">

Loading...

</p>

</div>

</section>

<!-- Related Products -->

<section class="related">

<h2>

You May Also Like

</h2>

<div

id="relatedProducts"

class="related-grid">

<!-- JS -->

</div>

</section>

<!-- Toast -->

<div

id="toast"

class="toast">

Added To Cart

</div>

<script src="js/products.js"></script>

<script src="js/app.js"></script>

<script src="js/product.js"></script>

</body>

</html>
